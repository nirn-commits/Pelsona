<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>日記カレンダー</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Hiragino Sans', 'Yu Gothic UI', sans-serif;
    background: #f7f7f5;
    color: #1a1a1a;
    min-height: 100vh;
  }

  header {
    background: #fff;
    border-bottom: 1px solid #e5e5e5;
    padding: 16px 20px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    position: sticky;
    top: 0;
    z-index: 100;
  }

  header h1 {
    font-size: 17px;
    font-weight: 600;
    letter-spacing: 0.02em;
  }

  .header-btns {
    display: flex;
    gap: 8px;
    align-items: center;
  }

  .api-toggle {
    font-size: 12px;
    color: #888;
    background: none;
    border: 1px solid #ddd;
    border-radius: 6px;
    padding: 4px 10px;
    cursor: pointer;
  }

  .back-link {
    font-size: 12px;
    color: #888;
    text-decoration: none;
    border: 1px solid #ddd;
    border-radius: 6px;
    padding: 4px 10px;
  }
  .back-link:hover { background: #f5f5f5; }

  /* API設定パネル */
  .api-panel {
    background: #fff;
    border-bottom: 1px solid #e5e5e5;
    padding: 12px 20px;
    display: none;
  }
  .api-panel.open { display: block; }
  .api-panel label { font-size: 12px; color: #666; display: block; margin-bottom: 6px; }
  .api-panel input {
    width: 100%;
    border: 1px solid #ddd;
    border-radius: 8px;
    padding: 8px 12px;
    font-size: 13px;
    outline: none;
  }
  .api-panel input:focus { border-color: #1a1a1a; }

  /* カレンダー */
  .calendar-nav {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 24px;
    padding: 16px 20px 8px;
  }

  .nav-btn {
    background: none;
    border: none;
    font-size: 20px;
    cursor: pointer;
    color: #555;
    width: 36px;
    height: 36px;
    display: flex;
    align-items: center;
    justify-content: center;
    border-radius: 50%;
  }
  .nav-btn:active { background: #eee; }

  .month-label {
    font-size: 16px;
    font-weight: 600;
    min-width: 120px;
    text-align: center;
  }

  .weekdays {
    display: grid;
    grid-template-columns: repeat(7, 1fr);
    padding: 0 12px;
    margin-bottom: 4px;
  }
  .weekday {
    text-align: center;
    font-size: 11px;
    color: #999;
    padding: 4px 0;
  }
  .weekday:first-child { color: #e05; }
  .weekday:last-child { color: #58c; }

  .calendar-grid {
    display: grid;
    grid-template-columns: repeat(7, 1fr);
    gap: 2px;
    padding: 0 12px;
  }

  .day-cell {
    aspect-ratio: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    border-radius: 10px;
    cursor: pointer;
    position: relative;
    padding: 2px;
    transition: background 0.15s;
  }
  .day-cell:active { background: #eee; }
  .day-cell.empty { cursor: default; }
  .day-cell.today .day-num {
    background: #1a1a1a;
    color: #fff;
    border-radius: 50%;
    width: 28px;
    height: 28px;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .day-cell.sunday .day-num { color: #e05; }
  .day-cell.saturday .day-num { color: #58c; }
  .day-cell.today .day-num { color: #fff !important; }

  .day-num {
    font-size: 14px;
    font-weight: 500;
    width: 28px;
    height: 28px;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .has-entry::after {
    content: '';
    display: block;
    width: 4px;
    height: 4px;
    border-radius: 50%;
    background: #1a1a1a;
    position: absolute;
    bottom: 6px;
  }
  .today.has-entry::after { background: #fff; }

  /* 入力・表示エリア */
  .entry-panel {
    margin: 16px 16px 0;
    background: #fff;
    border-radius: 14px;
    border: 1px solid #e5e5e5;
    overflow: hidden;
  }

  .entry-date {
    padding: 12px 16px;
    border-bottom: 1px solid #f0f0f0;
    font-size: 13px;
    color: #666;
    font-weight: 500;
  }

  .entry-content {
    padding: 14px 16px;
    min-height: 80px;
    font-size: 15px;
    line-height: 1.7;
    white-space: pre-wrap;
    word-break: break-all;
  }
  .entry-content.placeholder { color: #bbb; }

  .entry-actions {
    padding: 10px 16px;
    border-top: 1px solid #f0f0f0;
    display: flex;
    gap: 8px;
    justify-content: space-between;
    align-items: center;
  }

  .btn-delete {
    font-size: 13px;
    padding: 7px 14px;
    border-radius: 8px;
    border: 1px solid #fcc;
    background: #fff;
    cursor: pointer;
    color: #c00;
  }
  .btn-delete:active { background: #fff3f3; }

  .btn-edit {
    font-size: 13px;
    padding: 7px 16px;
    border-radius: 8px;
    border: 1px solid #ddd;
    background: #fff;
    cursor: pointer;
    color: #333;
  }
  .btn-edit:active { background: #f5f5f5; }

  /* 入力モード */
  .input-panel {
    margin: 16px 16px 0;
    background: #fff;
    border-radius: 14px;
    border: 1px solid #e5e5e5;
    overflow: hidden;
    display: none;
  }
  .input-panel.active { display: block; }

  .input-date {
    padding: 12px 16px;
    border-bottom: 1px solid #f0f0f0;
    font-size: 13px;
    color: #666;
    font-weight: 500;
  }

  textarea {
    width: 100%;
    border: none;
    outline: none;
    padding: 14px 16px;
    font-size: 15px;
    line-height: 1.7;
    resize: none;
    min-height: 120px;
    font-family: inherit;
    background: transparent;
  }

  .input-actions {
    padding: 10px 16px;
    border-top: 1px solid #f0f0f0;
    display: flex;
    gap: 8px;
    justify-content: space-between;
    align-items: center;
  }

  .btn-cancel {
    font-size: 13px;
    padding: 7px 14px;
    border-radius: 8px;
    border: 1px solid #ddd;
    background: #fff;
    cursor: pointer;
    color: #666;
  }

  .btn-save {
    font-size: 13px;
    padding: 7px 16px;
    border-radius: 8px;
    border: 1px solid #ddd;
    background: #fff;
    cursor: pointer;
    color: #333;
  }
  .btn-save:active { background: #f5f5f5; }

  .btn-ai {
    font-size: 13px;
    padding: 7px 18px;
    border-radius: 8px;
    border: none;
    background: #1a1a1a;
    color: #fff;
    cursor: pointer;
    display: flex;
    align-items: center;
    gap: 6px;
  }
  .btn-ai:disabled { opacity: 0.5; cursor: not-allowed; }
  .btn-ai:active:not(:disabled) { background: #333; }

  .spinner {
    width: 12px;
    height: 12px;
    border: 2px solid rgba(255,255,255,0.3);
    border-top-color: #fff;
    border-radius: 50%;
    animation: spin 0.7s linear infinite;
    display: none;
  }
  .btn-ai.loading .spinner { display: block; }
  .btn-ai.loading .btn-text { display: none; }

  @keyframes spin {
    to { transform: rotate(360deg); }
  }

  /* エラー */
  .error-msg {
    margin: 8px 16px 0;
    background: #fff3f3;
    border: 1px solid #fcc;
    border-radius: 10px;
    padding: 10px 14px;
    font-size: 13px;
    color: #c00;
    display: none;
  }
  .error-msg.show { display: block; }

  .bottom-space { height: 40px; }
</style>
</head>
<body>

<header>
  <h1>日記カレンダー</h1>
  <div class="header-btns">
    <button class="api-toggle" id="btnCopyUrl">URLコピー</button>
    <button class="api-toggle" id="apiToggle">APIキー</button>
    <a href="index.html" class="back-link">← Pelsona</a>
  </div>
</header>

<div class="api-panel" id="apiPanel">
  <label>Gemini API Key</label>
  <input type="password" id="apiKeyInput" placeholder="AIza..." autocomplete="off">
</div>

<div class="calendar-nav">
  <button class="nav-btn" id="prevMonth">‹</button>
  <div class="month-label" id="monthLabel"></div>
  <button class="nav-btn" id="nextMonth">›</button>
</div>

<div class="weekdays">
  <div class="weekday">日</div>
  <div class="weekday">月</div>
  <div class="weekday">火</div>
  <div class="weekday">水</div>
  <div class="weekday">木</div>
  <div class="weekday">金</div>
  <div class="weekday">土</div>
</div>

<div class="calendar-grid" id="calendarGrid"></div>

<div class="entry-panel" id="entryPanel" style="display:none">
  <div class="entry-date" id="entryDate"></div>
  <div class="entry-content" id="entryContent"></div>
  <div class="entry-actions">
    <button class="btn-delete" id="btnDelete">削除</button>
    <button class="btn-edit" id="btnEdit">編集</button>
  </div>
</div>

<div class="input-panel" id="inputPanel">
  <div class="input-date" id="inputDate"></div>
  <textarea id="diaryInput" placeholder="今日やったこと、食べたもの、感じたことなど…"></textarea>
  <div class="input-actions">
    <button class="btn-cancel" id="btnCancel">キャンセル</button>
    <div style="display:flex;gap:8px">
      <button class="btn-save" id="btnSave">そのまま保存</button>
      <button class="btn-ai" id="btnAI">
        <span class="btn-text">AIでまとめる</span>
        <div class="spinner"></div>
      </button>
    </div>
  </div>
</div>

<div class="error-msg" id="errorMsg"></div>
<div class="bottom-space"></div>

<script>
// ---- localStorage wrapper ----
const storage = {
  set(key, value) { localStorage.setItem(key, value); },
  get(key) {
    const v = localStorage.getItem(key);
    return v !== null ? { value: v } : null;
  },
  remove(key) { localStorage.removeItem(key); },
  list(prefix) {
    const keys = [];
    for (let i = 0; i < localStorage.length; i++) {
      const k = localStorage.key(i);
      if (k && k.startsWith(prefix)) keys.push(k);
    }
    return { keys };
  }
};

// ---- State ----
let currentYear, currentMonth, selectedDate;
const entries = {}; // { "YYYY-MM-DD": "まとめ文" }

function saveEntry(key, value) {
  storage.set('diary:' + key, value);
}
function deleteEntry(key) {
  storage.remove('diary:' + key);
}
function loadAllEntries() {
  const result = storage.list('diary:');
  if (result && result.keys) {
    for (const k of result.keys) {
      const dateKey = k.replace('diary:', '');
      const r = storage.get(k);
      if (r) entries[dateKey] = r.value;
    }
  }
}
function saveApiKey(key) { storage.set('diary_gemini_api_key', key); }
function loadApiKey() {
  const r = storage.get('diary_gemini_api_key');
  return r ? r.value : '';
}

// ---- Calendar ----
function formatKey(y, m, d) {
  return `${y}-${String(m+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
}

function renderCalendar() {
  const grid = document.getElementById('calendarGrid');
  grid.innerHTML = '';
  document.getElementById('monthLabel').textContent = `${currentYear}年${currentMonth+1}月`;

  const today = new Date();
  const firstDay = new Date(currentYear, currentMonth, 1).getDay();
  const daysInMonth = new Date(currentYear, currentMonth+1, 0).getDate();

  for (let i = 0; i < firstDay; i++) {
    const empty = document.createElement('div');
    empty.className = 'day-cell empty';
    grid.appendChild(empty);
  }

  for (let d = 1; d <= daysInMonth; d++) {
    const cell = document.createElement('div');
    cell.className = 'day-cell';
    const dow = (firstDay + d - 1) % 7;
    if (dow === 0) cell.classList.add('sunday');
    if (dow === 6) cell.classList.add('saturday');

    const isToday = (
      today.getFullYear() === currentYear &&
      today.getMonth() === currentMonth &&
      today.getDate() === d
    );
    if (isToday) cell.classList.add('today');

    const key = formatKey(currentYear, currentMonth, d);
    if (entries[key]) cell.classList.add('has-entry');

    const num = document.createElement('div');
    num.className = 'day-num';
    num.textContent = d;
    cell.appendChild(num);

    cell.addEventListener('click', () => selectDate(currentYear, currentMonth, d));
    grid.appendChild(cell);
  }
}

function selectDate(y, m, d) {
  selectedDate = formatKey(y, m, d);
  const dateStr = `${y}年${m+1}月${d}日`;
  hideError();

  if (entries[selectedDate]) {
    showEntry(dateStr);
  } else {
    showInput(dateStr);
  }
}

function showEntry(dateStr) {
  document.getElementById('entryDate').textContent = dateStr;
  document.getElementById('entryContent').textContent = entries[selectedDate];
  document.getElementById('entryContent').classList.remove('placeholder');
  document.getElementById('entryPanel').style.display = 'block';
  document.getElementById('inputPanel').classList.remove('active');
}

function showInput(dateStr) {
  document.getElementById('inputDate').textContent = dateStr;
  document.getElementById('diaryInput').value = '';
  document.getElementById('entryPanel').style.display = 'none';
  document.getElementById('inputPanel').classList.add('active');
  setTimeout(() => document.getElementById('diaryInput').focus(), 100);
}

// ---- Gemini API ----
async function summarizeWithGemini(text) {
  const apiKey = document.getElementById('apiKeyInput').value.trim();
  if (!apiKey) throw new Error('APIキーを入力してください（右上「APIキー」から）');

  const prompt = `以下の日記メモを、1〜3文の自然な日本語でまとめてください。体言止めや箇条書きは使わず、その日を振り返る文章として書いてください。\n\n${text}`;

  const res = await fetch(
    `https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent?key=${apiKey}`,
    {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        contents: [{ parts: [{ text: prompt }] }],
        generationConfig: { temperature: 0.7, maxOutputTokens: 1024 }
      })
    }
  );

  if (!res.ok) {
    const err = await res.json().catch(() => ({}));
    throw new Error(err?.error?.message || `APIエラー (${res.status})`);
  }

  const data = await res.json();
  return data.candidates?.[0]?.content?.parts?.[0]?.text?.trim() || 'まとめを生成できませんでした';
}

function showError(msg) {
  const el = document.getElementById('errorMsg');
  el.textContent = msg;
  el.classList.add('show');
}
function hideError() {
  document.getElementById('errorMsg').classList.remove('show');
}

// ---- Events ----
document.getElementById('btnCopyUrl').addEventListener('click', async () => {
  const btn = document.getElementById('btnCopyUrl');
  try {
    await navigator.clipboard.writeText(location.href);
    btn.textContent = 'コピーした';
    setTimeout(() => btn.textContent = 'URLコピー', 2000);
  } catch(e) {
    btn.textContent = '失敗';
    setTimeout(() => btn.textContent = 'URLコピー', 2000);
  }
});

document.getElementById('apiToggle').addEventListener('click', () => {
  document.getElementById('apiPanel').classList.toggle('open');
});

document.getElementById('apiKeyInput').addEventListener('change', (e) => {
  saveApiKey(e.target.value.trim());
});

document.getElementById('prevMonth').addEventListener('click', () => {
  if (currentMonth === 0) { currentYear--; currentMonth = 11; }
  else currentMonth--;
  renderCalendar();
});

document.getElementById('nextMonth').addEventListener('click', () => {
  if (currentMonth === 11) { currentYear++; currentMonth = 0; }
  else currentMonth++;
  renderCalendar();
});

document.getElementById('btnCancel').addEventListener('click', () => {
  document.getElementById('inputPanel').classList.remove('active');
  document.getElementById('entryPanel').style.display = 'none';
  hideError();
});

document.getElementById('btnEdit').addEventListener('click', () => {
  const dateStr = document.getElementById('entryDate').textContent;
  document.getElementById('inputDate').textContent = dateStr;
  document.getElementById('diaryInput').value = entries[selectedDate] || '';
  document.getElementById('entryPanel').style.display = 'none';
  document.getElementById('inputPanel').classList.add('active');
  setTimeout(() => document.getElementById('diaryInput').focus(), 100);
});

document.getElementById('btnDelete').addEventListener('click', () => {
  if (!selectedDate || !entries[selectedDate]) return;
  if (!confirm('この日の日記を削除しますか？')) return;
  delete entries[selectedDate];
  deleteEntry(selectedDate);
  renderCalendar();
  document.getElementById('entryPanel').style.display = 'none';
});

document.getElementById('btnSave').addEventListener('click', () => {
  const text = document.getElementById('diaryInput').value.trim();
  if (!text) return;
  entries[selectedDate] = text;
  saveEntry(selectedDate, text);
  renderCalendar();
  const parts = selectedDate.split('-');
  showEntry(`${parts[0]}年${parseInt(parts[1])}月${parseInt(parts[2])}日`);
});

document.getElementById('btnAI').addEventListener('click', async () => {
  const text = document.getElementById('diaryInput').value.trim();
  if (!text) return;

  const btn = document.getElementById('btnAI');
  btn.classList.add('loading');
  btn.disabled = true;
  hideError();

  try {
    const summary = await summarizeWithGemini(text);
    entries[selectedDate] = summary;
    saveEntry(selectedDate, summary);
    renderCalendar();
    const parts = selectedDate.split('-');
    showEntry(`${parts[0]}年${parseInt(parts[1])}月${parseInt(parts[2])}日`);
  } catch(e) {
    showError(e.message);
  } finally {
    btn.classList.remove('loading');
    btn.disabled = false;
  }
});

// ---- Init ----
loadAllEntries();
const savedKey = loadApiKey();
if (savedKey) document.getElementById('apiKeyInput').value = savedKey;

const now = new Date();
currentYear = now.getFullYear();
currentMonth = now.getMonth();
renderCalendar();
</script>
</body>
</html>
